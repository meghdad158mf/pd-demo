/* Identity «پرچمدار»: a flag-bearer's banner — deep civic navy as the field, gold reserved for the flag (membership)
   Semantic colors never borrow the brand hues: pending = orange, not gold; purple is retired.
   Layout: sticky top bar (bottom tab bar on phones) · list = filters + map + compact rows · dossier = tabs first, map aside */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eff2f6; --line:#dfe4eb; --fg:#13213a; --muted:#56657a;
  --navy:#0b3d3a;
  --accent:#0f5f58; --accent-ink:#ffffff; --accent-soft:#e1f0ee; --accent-fg:#0d524c;
  --flag:#c4911a; --flag-soft:#fbf1d8; --flag-ink:#77520a;
  --cand:#d9ae52; --cand-soft:#fffaf0; --cand-ink:#7a5a14;
  --ok:#2f8a3b; --ok-soft:#e4f3e3; --ok-ink:#226b2c;
  --warn:#d4560d; --warn-soft:#fdebdf; --warn-ink:#9c3d08;
  --bad:#c9363b; --bad-soft:#fbe6e7; --bad-ink:#9f262b;
  --mute:#94a1b4; --mute-soft:#edf0f4; --mute-ink:#4f5d72;
  --shadow:0 1px 2px rgba(15,28,46,.04),0 8px 24px rgba(15,28,46,.06);
  --tile-filter:saturate(.75); --grid:rgba(15,95,88,.06);
  --font:'IRANSansX','IRANSansX Static',Tahoma,'Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}

/* ---- Leaflet essentials (inlined) ---- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--font);outline-offset:1px}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200;filter:var(--tile-filter)}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-touch-drag{touch-action:none}
.leaflet-bar{box-shadow:var(--shadow);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;background:var(--surface);color:var(--fg);border-bottom:1px solid var(--line);font:600 17px/30px var(--mono)}
.leaflet-bar a:last-child{border-bottom:none}.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);font-size:10.5px;padding:0 6px;margin:0!important}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-tooltip{position:absolute;padding:2px 8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--fg);white-space:nowrap;user-select:none;pointer-events:none;box-shadow:var(--shadow);font:600 12px/1.6 var(--font);direction:rtl}
.leaflet-tooltip.lbl{padding:0 6px;font-size:11.5px;background:color-mix(in srgb,var(--surface) 88%,transparent)}

/* ---- Base ---- */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.75;direction:rtl}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:800}h2{font-size:17px;font-weight:700}h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent-fg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-weight:500;font-size:12px;direction:ltr;unicode-bidi:isolate;letter-spacing:.02em;color:var(--muted);background:var(--surface-2);border:0;border-radius:6px;padding:1px 7px;white-space:nowrap}
.spacer{flex:1}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:22px 56px}

/* ---- Top bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1100;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none}
.brand svg,.brand .logo{flex:none}
.logo{display:block;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.brand b{display:block;font-weight:800;font-size:18px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.nav{display:flex;gap:4px}
.nav a{padding:5px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{color:var(--fg);background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-fg)}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.who label{font-size:12px;color:var(--muted);white-space:nowrap}
.who select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;max-width:240px}

/* ---- Controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,transform .1s ease}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad-ink)}
.btn.danger[data-armed]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;font-size:12.5px}
.icon-btn{border:0;background:transparent;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=tel],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:84px;line-height:1.7}

.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.9}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.pill.flag{background:var(--flag-soft);color:var(--flag-ink)}
.pill.cand{background:var(--cand-soft);color:var(--cand-ink);box-shadow:inset 0 0 0 1px var(--cand)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.mute{background:var(--mute-soft);color:var(--mute-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent-fg)}
.tag{display:inline-block;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);line-height:1.9;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---- Page head / banner ---- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between;margin-block-end:18px}
.page-head .sub{color:var(--muted);font-size:13px;margin-block-start:2px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);margin-block-end:18px;font-size:13.5px;background:var(--accent-soft);color:var(--accent-fg)}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.banner b{font-weight:700}

/* ---- Stats ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block-end:18px}
.stat{display:flex;flex-direction:column;gap:2px;text-align:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:border-color .15s ease}
.stat:hover{border-color:var(--accent)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stat .v{font-size:24px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---- List page ---- */
.list-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.filters{padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.filters summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.filters h2{font-size:14px}
.filters .fbody{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.list-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1 1 260px}
.toolbar select{flex:0 0 auto;width:auto}
.active-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.active-chips button{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-fg);border-radius:999px;padding:0 10px;cursor:pointer;font-weight:600;font-size:12px}
.map{height:380px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);position:relative;z-index:0}
.map.no-tiles{background-color:var(--surface-2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.map-note{position:absolute;inset-block-end:8px;inset-inline-start:8px;z-index:900;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);direction:rtl;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{text-align:start;font-size:12px;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background-color .12s ease}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nb-name{font-weight:700}
.nb-addr{font-size:12px;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{color:var(--muted)}.dot.off::before{background:transparent;border:1.5px solid var(--mute)}
.crit{color:var(--bad-ink);font-weight:700;font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---- Dossier ---- */
.crumb{font-size:13px;color:var(--muted);margin-block-end:10px}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--accent-fg)}
.d-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-block-end:18px}
.d-title{display:flex;flex-direction:column;gap:8px}
.d-title .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.d-title h1{font-size:28px}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.d-aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.d-aside .map{height:280px;border-radius:var(--r) var(--r) 0 0;border:0;border-bottom:1px solid var(--line)}
.d-aside .map.picking{outline:3px solid var(--flag);outline-offset:-3px}
.sec{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-block-end:16px;scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent-fg);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:12px;background:var(--surface-2);border-radius:999px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-block-end:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.person{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.person .top-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.person .name{font-weight:700}
.person .phone{font-family:var(--mono);font-size:13px;direction:ltr;unicode-bidi:isolate}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;flex:none}
.prob{border:1px solid var(--line);border-inline-start:4px solid var(--mute);border-radius:8px;background:var(--surface)}
.prob.p-critical{border-inline-start-color:var(--bad)}.prob.p-high{border-inline-start-color:var(--warn)}.prob.p-mid{border-inline-start-color:var(--accent)}
.prob-h{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;width:100%;background:transparent;border:0;text-align:start}
.prob-h .t{font-weight:700}
.prob-h .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:4px;align-items:center}
.prob-h .chev{margin-inline-start:auto;color:var(--muted);transition:transform .2s ease;flex:none;margin-top:4px}
.prob.open .chev{transform:rotate(180deg)}
.prob-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding-inline-start:24px;padding-block-end:14px}
.timeline li::before{content:"";position:absolute;inset-inline-start:5px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline li::after{content:"";position:absolute;inset-inline-start:10px;top:20px;bottom:-6px;width:2px;background:var(--line)}
.timeline li:last-child{padding-block-end:0}
.timeline li:last-child::after{display:none}
.timeline .when{font-size:12px;color:var(--muted)}
.timeline .what{font-weight:600}
.timeline .note{font-size:13px;color:var(--muted)}
.idea{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.idea .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.review{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.review .d{font-size:13px;font-weight:700}
.review .body{display:flex;flex-direction:column;gap:4px}
.review .res{font-size:13px;background:var(--surface-2);border-radius:6px;padding:6px 10px}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini-stats div{padding:10px 12px;background:var(--surface-2);border-radius:8px}
.mini-stats b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.mini-stats span{font-size:12px;color:var(--muted)}
.desc{max-width:68ch}

/* ---- Admin ---- */
.matrix th,.matrix td{text-align:center}.matrix th:first-child,.matrix td:first-child{text-align:start}
.matrix td{font-size:13px}
.yes{color:var(--ok-ink);font-weight:700}.no{color:var(--mute)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.chip-list .tag{display:inline-flex;align-items:center;gap:4px;padding-inline-end:4px}
.chip-list .tag button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;border-radius:4px}
.chip-list .tag button:hover{color:var(--bad-ink);background:var(--bad-soft)}
.inline-add{display:flex;gap:6px;max-width:380px}
.pattern-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;max-width:520px}
.pattern-box input{font-family:var(--mono);direction:ltr;text-align:left}
.preview-codes{display:flex;flex-wrap:wrap;gap:8px}

/* ---- Login ---- */
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-inline:16px;padding-block:40px}
.login-box{width:min(380px,100%);display:flex;flex-direction:column;gap:22px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login-brand b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.login-brand small{display:block;color:var(--muted);font-size:13px}
.login-card{padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);border-color:transparent}
.login-card h1{font-size:17px;font-weight:700}
.login-card input{padding:9px 12px}
.btn.block{width:100%;padding-block:9px;font-size:14px}
.demo-row{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.demo-row button{border:0;background:transparent;color:var(--accent-fg);font-weight:600;cursor:pointer;padding:2px 8px;border-radius:6px;font-size:12.5px}
.demo-row button:hover{background:var(--accent-soft)}
.demo-row i{width:3px;height:3px;border-radius:50%;background:var(--mute);display:inline-block}
.login-foot{font-size:12px;color:var(--muted)}
.city-strip{display:flex;gap:6px;flex-wrap:wrap}
.city-strip button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--fg)}
.city-strip button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.city-strip button:hover{border-color:var(--accent)}
.city-strip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.city-strip button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}
.field .errmsg{font-size:12px;color:var(--bad-ink)}

/* ---- Dialog ---- */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.25);direction:rtl}
dialog::backdrop{background:rgba(10,16,13,.45)}
dialog[open]{animation:pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.form{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.form header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.form .fields{padding:16px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.form footer{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.chip-toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip-toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}

.toast{position:fixed;inset-block-end:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);z-index:3000;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);transition:opacity .2s ease,transform .2s ease}
.toast[hidden]{display:block!important;opacity:0;transform:translate(50%,8px);pointer-events:none}



/* ---- Shamsi date picker ---- */
.date-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:start;color:var(--fg);transition:border-color .15s ease,box-shadow .15s ease}
.date-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.date-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.date-btn svg{color:var(--accent);flex:none}
.date-btn .dv{font-weight:700;font-variant-numeric:tabular-nums}
.date-btn .dr{margin-inline-start:auto;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 9px;line-height:1.9}
.date-btn .dr:empty{display:none}
.field.err .date-btn{border-color:var(--bad)}
.dp{margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);max-width:360px;animation:pop .16s cubic-bezier(.2,.8,.2,1)}
.dp-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.dp-nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg);display:grid;place-items:center;padding:0}
.dp-nav:hover{background:var(--surface-2)}
.dp-nav[disabled]{opacity:.35;cursor:not-allowed}
.dp-title{border:0;background:transparent;font-weight:800;font-size:15px;cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--fg)}
button.dp-title:hover{background:var(--surface-2)}
.dp-title small{font-size:10px;color:var(--muted)}
.dp-wd,.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.dp-wd span{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
.dp-wd .fri,.dp-grid .fri{color:var(--bad-ink)}
.dp-grid button{height:40px;border:0;border-radius:10px;background:transparent;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--fg);font-size:14px}
.dp-grid button:hover{background:var(--accent-soft)}
.dp-grid button.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-fg)}
.dp-grid button.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.dp-grid button[disabled]{color:var(--mute);opacity:.45;cursor:not-allowed;background:transparent}
.dp-f{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dp-f button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--fg)}

function makeCode(pattern,c,d,s){

}

  st.cities.forEach(c=>{c.province=c.province||PROV_OF[c.name]||c.name;});
  /* two more cities, so a province with several cities can be seen in the demo */
  const R=rng(2025),extra=[{name:'نیشابور',code:'NSH',lat:36.213,lng:58.795,d:4,province:'خراسان رضوی'},{name:'کاشان',code:'KSH',lat:33.985,lng:51.41,d:4,province:'اصفهان'}];
  const NM=['امام رضا','باغ رودکی','سبزه‌میدان','شهرک فرهنگیان','فردوسی','کوی ولیعصر','پشت‌مشهد','سلطان امیر احمد','فین','شهرک صنعتی','بازار','آزادگان'];
  extra.forEach((c,ci)=>{if(st.cities.some(x=>x.name===c.name))return;st.cities.push(c);
    for(let i=0;i<6;i++){const d=1+Math.floor(R()*c.d);const fl=R()<.25?'member':R()<.3?'candidate':'none';
      db.nb.push({id:uid(),city:c.name,district:d,name:NM[ci*6+i],lat:+(c.lat+(R()-.5)*.04).toFixed(5),lng:+(c.lng+(R()-.5)*.05).toFixed(5),flag:fl,flagSince:fl==='member'?isoDaysAgo(30+Math.floor(R()*300)):'',active:true,pop:2000+Math.floor(R()*14000),address:c.name+'، محله '+NM[ci*6+i],postal:'',desc:'',op:'',code:'',seq:0,links:[],problems:[],ideas:[],reviews:[],updatedAt:Date.now()-30*DAY,updatedBy:'مریم احمدی'});}
    db.nb.filter(n=>n.city===c.name).forEach((n,i)=>{n.seq=i+1;n.code=makeCode(st.codePattern,c,n.district,n.seq);});});
  st.provinces=[...new Set(st.cities.map(c=>c.province))];
  db.users.forEach(u=>{if(u.role==='supervisor'&&!u.province){u.province=PROV_OF[u.city]||provOf(u.city);u.city='';}});
  ver++;persist();
}
/* data scope: an operator sees only the neighborhoods assigned to them and the people linked to those;
   a supervisor sees only their own city; admin and the read-only demo level see everything */
function nbIn(n){const u=me();if(!u||!n)return false;if(u.role==='admin'||u.role==='viewer')return true;if(u.role==='supervisor')return inProv(n.city,u);return n.op===u.id||(!!n._st&&authorOf(n)===u.id);}
function pIn(p){const u=me();if(!u||!p)return false;if(u.role==='admin'||u.role==='viewer')return true;const ls=linksOf(p.id);
  if(u.role==='supervisor')return ls.some(x=>inProv(x.n.city,u))||inProv(getU(p.by)?.city,u)||p.by===u.id;return ls.some(x=>x.n.op===u.id)||p.by===u.id;}
const visN=n=>vis(n)&&nbIn(n),visP=p=>vis(p)&&pIn(p);
const myLinks=pid=>linksOf(pid).filter(x=>nbIn(x.n));
function vis(o){if(!o._st)return true;const u=me();if(!u||u.role==='viewer')return false;if(u.role==='admin'||u.role==='supervisor')return true;return authorOf(o)===u.id;}
function stBadge(o){
  if(o._st==='pending')return '<span class="pill warn i-clock">در انتظار تأیید</span>';
  if(o._st==='rejected')return '<span class="pill bad i-back">برگشت برای اصلاح</span>';
  if(o._cid){const c=chById(o._cid);if(c&&c.st==='pending')return `<span class="pill warn i-clock">${c.op==='delete'?'حذف':'ویرایش'} در انتظار تأیید</span>`;}
  return '';
}
function rvInline(o){if(!o._cid)return '';const c=chById(o._cid);if(!c)return '';
  let h='';
  if(c.st==='rejected'&&c.rv?.note)h+=`<div class="rej-note"><b>دلیل برگشت:</b> ${esc(c.rv.note)}</div>`;
  if(canReview(c))h+=`<div class="rv-inline"><span class="muted small">ثبت: ${esc(uName(c.uid))}، ${relTime(c.t)}</span><button class="btn sm ok" data-act="ap" data-cid="${c.id}">تأیید</button><button class="btn sm danger" data-act="rj" data-cid="${c.id}">عدم تأیید</button></div>`;
  return h;
}

/* ================= change workflow ================= */
function host(ch){
  if(ch.ent==='nb')return db.nb;
  if(ch.ent==='person')return db.people;
  if(ch.ent==='contact'){const p=getP(ch.pid);return p?p.contacts:null;}
  if(ch.ent==='course'){const p=getP(ch.pid);return p?(p.courseLog||(p.courseLog=[])):null;}
  const n=findN(ch.nb);if(!n)return null;
  if(ch.ent==='step'){const p=n.problems.find(x=>x.id===ch.par);return p?p.steps:null;}
  return n[{link:'links',problem:'problems',idea:'ideas',review:'reviews',program:'programs'}[ch.ent]]||null;
}
const target=ch=>{const a=host(ch);return a?a.find(x=>x.id===ch.tid):null;};
function recompute(p){const s=p.steps.filter(x=>!x._st).sort((a,b)=>a.date.localeCompare(b.date));const l=s[s.length-1];if(l){p.status=l.status;if(l.org)p.org=l.org;}}
function after(ch,o,actor,t){
  ver++;
  if(ch.ent==='nb'&&o&&!o.code){
    const seq=Math.max(0,...db.nb.filter(x=>x.city===o.city&&x.district===o.district&&x.code).map(x=>x.seq||0))+1;
    let s=seq,code=codeFor(o,s);while(db.nb.some(x=>x.code===code)){s++;code=codeFor(o,s);}o.seq=s;o.code=code;
  }
  if(ch.ent==='step'){const n=findN(ch.nb);const p=n?.problems.find(x=>x.id===ch.par);if(p)recompute(p);}
  const n=ch.nb&&findN(ch.nb);
  if(n){n.updatedAt=t;n.updatedBy=actor?.name||'—';}
}
function apply(ch,actor,t){
  const a=host(ch);if(!a)return null;
  if(ch.op==='create'){const ex=a.find(x=>x.id===ch.tid);const o={...clone(ch.data),id:ch.tid};if(ex){Object.keys(ex).forEach(k=>delete ex[k]);Object.assign(ex,o);}else a.push(o);after(ch,ex||o,actor,t);return null;}
  const i=a.findIndex(x=>x.id===ch.tid);if(i<0)return null;const o=a[i];
  if(ch.op==='update'){const prev={};Object.keys(ch.data).forEach(k=>prev[k]=clone(o[k]));Object.assign(o,clone(ch.data));delete o._cid;delete o._del;after(ch,o,actor,t);return prev;}
  if(ch.op==='delete'){a.splice(i,1);after(ch,null,actor,t);return {obj:clone(o),i};}
  return null;
}
function stage(ch){
  const a=host(ch);if(!a)return;
  if(ch.op==='create'){const o={...clone(ch.data),id:ch.tid,_st:'pending',_cid:ch.id};const ex=a.find(x=>x.id===ch.tid);if(ex){Object.keys(ex).forEach(k=>delete ex[k]);Object.assign(ex,o);}else a.push(o);}
  else{const o=a.find(x=>x.id===ch.tid);if(o){o._cid=ch.id;if(ch.op==='delete')o._del=1;}}
  ver++;
}
/* operators submit for approval; supervisors' entries apply at once (admin can still reject them); admin applies directly */
function commit(spec,actor=me(),t=Date.now()){
  const ch={id:uid(),t,uid:actor.id,...spec};
  if(ch.op==='create'&&!ch.tid)ch.tid=uid();
  if(actor.role==='operator'){
    if(ch.op==='update'){const o=target(ch);const prev=o&&o._cid&&chById(o._cid);
      if(prev&&prev.st==='pending'&&prev.uid===actor.id&&prev.op==='update'){Object.assign(prev.data,clone(ch.data));prev.t=t;persist();return prev;}}
    ch.st='pending';stage(ch);
  }else{ch.prev=apply(ch,actor,t);ch.st=actor.role==='supervisor'?'auto':'admin';}
  if(ui.fixing){const f=chById(ui.fixing);if(f)f.fixed=true;ui.fixing=null;}
  db.changes.unshift(ch);
  actor.last=Math.max(actor.last||0,t);
  persist();return ch;
}
function approve(ch,by=me(),note='',t=Date.now()){
  if(!ch||ch.st!=='pending')return;
  const a=host(ch);const o=a&&a.find(x=>x.id===ch.tid);const author=getU(ch.uid);
  if(ch.op==='create'){if(o){delete o._st;delete o._cid;after(ch,o,author,t);}
    if(ch.ent==='link'&&o){const p=getP(o.pid);if(p&&p._st==='pending')approve(chById(p._cid),by,'',t);}}
  else if(ch.op==='update'){if(o){ch.prev={};Object.keys(ch.data).forEach(k=>ch.prev[k]=clone(o[k]));Object.assign(o,clone(ch.data));delete o._cid;after(ch,o,author,t);}}
  else if(ch.op==='delete'){if(o){ch.prev={obj:strip({...o,id:o.id}),i:a.indexOf(o)};ch.prev.obj.id=o.id;a.splice(a.indexOf(o),1);after(ch,null,author,t);}}
  ch.st='approved';ch.rv={uid:by.id,t,note};by.last=Math.max(by.last||0,t);if(undoLog)undoLog.push({ch,kind:'ap'});persist();
}
function reject(ch,by=me(),note='',t=Date.now()){
  if(!ch||ch.st!=='pending')return;
  const o=target(ch);
  if(ch.op==='create'){if(o)o._st='rejected';}
  else if(o&&o._cid===ch.id){delete o._cid;delete o._del;}
  ch.st='rejected';ch.rv={uid:by.id,t,note};by.last=Math.max(by.last||0,t);if(undoLog)undoLog.push({ch,kind:'rj'});ver++;persist();
}
function revoke(ch,by=me(),note=''){
  if(!ch||ch.st!=='auto')return;
  const a=host(ch);
  if(ch.op==='create'){if(a){const i=a.findIndex(x=>x.id===ch.tid);if(i>=0)a.splice(i,1);}}
  else if(ch.op==='update'){const o=a&&a.find(x=>x.id===ch.tid);if(o&&ch.prev)Object.assign(o,ch.prev);}
  else if(ch.op==='delete'){if(a&&ch.prev)a.splice(Math.min(ch.prev.i,a.length),0,ch.prev.obj);}
  if(ch.ent==='step'){const n=findN(ch.nb);const p=n?.problems.find(x=>x.id===ch.par);if(p)recompute(p);}
  ch.st='revoked';ch.rv={uid:by.id,t:Date.now(),note};ver++;persist();
}
/* save from a form: create, update (only changed fields), or resubmit an entry that is pending/returned */
function save(ent,o,data,ctx){
  if(!o)return commit({ent,op:'create',data,...ctx});
  if(o._st){
    const old=chById(o._cid);const full={...strip(o),...clone(data)};
    if(old&&old.st==='pending'){old.data=full;old.t=Date.now();stage(old);persist();return old;}
    if(old)old.fixed=true;
    return commit({ent,op:'create',tid:o.id,data:full,...ctx});
  }
  const d={};Object.keys(data).forEach(k=>{if(JSON.stringify(o[k]??null)!==JSON.stringify(data[k]??null))d[k]=data[k];});
  if(!Object.keys(d).length){toast('تغییری ثبت نشد');return null;}
  return commit({ent,op:'update',tid:o.id,data:d,...ctx});
}
function remove(ent,o,ctx){
  if(o._st){const c=chById(o._cid);const a=host(c||{ent,...ctx});if(a){const i=a.indexOf(o);if(i>=0)a.splice(i,1);}if(c)c.st='withdrawn';persist();return;}
  return commit({ent,op:'delete',tid:o.id,...ctx});
}

function groupOf(c){return c.grp?db.changes.filter(x=>x.grp===c.grp&&x.st==='pending'):[c];}
function toast(msg,undo){if(!msg)return;const t=$('#toast');t.textContent='';t.append(document.createTextNode(msg));
  if(undo){const b=document.createElement('button');b.type='button';b.className='toast-act';b.textContent='بازگرداندن';b.onclick=()=>{clearTimeout(toast._t);t.hidden=true;undo();};t.append(b);}
  t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,undo?6500:2400);}

/* undo for approve / reject: each call records what it did, the toast can roll it back */
let undoLog=null;
function undoOne({ch,kind}){
  const a=host(ch);const o=a&&a.find(x=>x.id===ch.tid);
  if(kind==='ap'){
    if(ch.op==='create'){if(o){o._st='pending';o._cid=ch.id;}}
    else if(ch.op==='update'){if(o&&ch.prev){Object.assign(o,clone(ch.prev));o._cid=ch.id;}}
    else if(ch.op==='delete'){if(a&&ch.prev&&!o){a.splice(Math.min(ch.prev.i,a.length),0,{...clone(ch.prev.obj),_cid:ch.id,_del:1});}}
  }else if(o){if(ch.op==='create')o._st='pending';else{o._cid=ch.id;if(ch.op==='delete')o._del=1;}}
  if(ch.ent==='step'){const n=findN(ch.nb);const p=n?.problems.find(x=>x.id===ch.par);if(p)recompute(p);}
  ch.st='pending';delete ch.rv;ver++;
}
function withUndo(fn,msg){undoLog=[];fn();const log=undoLog;undoLog=null;persist();render();
  toast(msg,log.length?()=>{log.slice().reverse().forEach(undoOne);persist();render();toast('بازگردانده شد؛ دوباره در کارتابل است');}:null);}

const lastStepDays=p=>{const l=p.steps.filter(x=>!x._st).reduce((a,x)=>x.date>a?x.date:a,'');return l?daysSince(l):99;};

function nbNeed(n){
  const op=openProblems(n);const crit=op.filter(p=>p.prio==='critical').sort((a,b)=>lastStepDays(b)-lastStepDays(a));
  if(crit.length){const d=lastStepDays(crit[0]);return {k:'urgent',r:`مشکل بحرانی «${esc(crit[0].title)}»، ${d?fa(d)+' روز بی‌پیگیری':'امروز پیگیری شد'}`,w:d};}
  const lr=lastReview(n);const d=lr?daysSince(lr):null;
  if(d===null||d>60)return {k:'review',r:d===null?'تاکنون بررسی نشده':`آخرین بررسی ${fa(d)} روز پیش`,w:d??999};
  return {k:'ok',r:`${op.length?fa(op.length)+' مشکل باز':'بدون مشکل باز'}، آخرین بررسی ${fa(d)} روز پیش`,w:0};
}

let maps=[];let tilesBlocked=false;

function makeMap(el,track=true){
  if(!window.L){el.innerHTML='<div class="empty">کتابخانه نقشه بارگذاری نشد.</div>';return null;}
  const m=L.map(el,{zoomControl:true,scrollWheelZoom:false,attributionControl:true,preferCanvas:true});
  m.attributionControl.setPrefix(false);
  const tl=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  let ok=0,bad=0;tl.on('tileload',()=>{ok++;});tl.on('tileerror',()=>{bad++;if(!ok&&bad>=2)markNoTiles(el);});
  tl.addTo(m);if(tilesBlocked)markNoTiles(el);if(track)maps.push(m);return m;
}
function markNoTiles(el){tilesBlocked=true;if(el.classList.contains('no-tiles'))return;el.classList.add('no-tiles');const n=document.createElement('div');n.className='map-note';n.textContent='نقشه پایه در این پیش‌نمایش بارگذاری نمی‌شود؛ موقعیت‌ها دقیق هستند.';el.appendChild(n);}

function navItems(u){
  const r=u.role,it=[];
  if(r==='operator')it.push(['home','خانه','home',returnedOf(u).length]);
  if(r==='supervisor')it.push(['home','خانه','home',0]);
  if(r==='supervisor'||r==='admin')it.push(['queue','کارتابل','queue',pendingCount()]);
  it.push(['list','محله‌ها','list',0]);
  if(r!=='supervisor')it.push(['problems','مشکلات','prob',0]);
  it.push(['people','افراد','people',0]);
  return it;
}
function moreItems(u){
  const r=u.role,it=[];
  if(r==='operator')it.push({h:'me',s:'عملکرد من',t:'عملکرد من',d:'آمار، نمودار فعالیت و سابقه‌ی ثبت‌ها',ic:'perf'});
  if(r==='supervisor')it.push({h:'problems',s:'مشکلات',t:'مشکلات محله‌ها',d:'باز، بحرانی و بدون پیگیری',ic:'prob'});
  if(r==='supervisor'||r==='admin')it.push({h:'perf',s:'عملکرد',t:'عملکرد کارشناسان',d:'ثبت‌ها، تأیید و برگشت، محله‌های عقب‌افتاده',ic:'perf'});
  if(r==='supervisor')it.push({h:'staff',s:'کارشناسان',t:'کارشناسان استان',d:'افزودن کارشناس و تعیین محله‌های هر نفر',ic:'people'},{h:'courses',t:'دوره‌های توانمندسازی',d:'دوره‌های استان و آمار شرکت متولیان',ic:'course'});
  if(r==='admin')it.push({h:'admin',tab:'users',s:'مدیریت',t:'کاربران و سطح دسترسی',d:'افزودن کاربر، شهر و نقش هر نفر',ic:'people'},
    {h:'admin',tab:'cats',t:'شهرها و دسته‌بندی‌ها',d:'نقش متولیان، مهارت‌ها، دسته‌ی مشکلات، نهادها',ic:'list'},
    {h:'admin',tab:'code',t:'فرمول کد محله',d:'الگوی ساخت کد پرونده‌ها',ic:'admin'},
    {h:'admin',tab:'log',t:'گزارش فعالیت',d:'همه‌ی ثبت‌ها و تغییرات سامانه',ic:'queue'});
  return it;
}

function topbar(u,route){
  const cur=h=>route===h||(h==='list'&&route.startsWith('n-'))||(h==='people'&&route.startsWith('p-'))||(h==='perf'&&route.startsWith('u-')&&u.role!=='operator')||(h==='me'&&route==='u-'+u.id);
  const groups=Object.keys(LEVEL).map(r=>[r,db.users.filter(x=>x.active&&x.role===r)]).filter(g=>g[1].length);
  return `<header class="top"><div class="top-in">
    <a class="brand" href="#${defaultRoute(u)}">${brandSvg(42)}<span><b>پرچمدار</b><small>سامانه مدیریت</small></span></a>
    <button type="button" class="gsearch ${['list','problems','people'].includes(route)?'gs-own':''}" data-act="search">${icon('search')}<span>جستجو در محله، فرد، مشکل…</span></button>
    <nav class="nav" aria-label="بخش‌ها">${navItems(u).map(([h,t,ic,c])=>`<a href="#${h}" ${cur(h)?'aria-current="page"':''}>${icon(ic)}<span>${t}</span>${c?`<em class="badge">${fa(c>99?'99+':c)}</em>`:''}</a>`).join('')}
      ${moreItems(u).filter(x=>x.s).map(x=>`<a href="#${x.h}" class="nav-x" ${cur(x.h)?'aria-current="page"':''}>${icon(x.ic)}<span>${x.s}</span></a>`).join('')}
      <a href="#" role="button" class="nav-more" data-act="more-menu" aria-haspopup="dialog" ${moreItems(u).some(x=>cur(x.h))||(route.startsWith('u-')&&u.role!=='operator')?'aria-current="page"':''}>${icon('dots')}<span>سایر</span></a></nav>
    <button type="button" class="acct-btn" data-act="more-menu" aria-haspopup="dialog" aria-label="حساب کاربری"><span class="avatar">${esc(initials(u.name))}</span><span class="acct-n"><b>${esc(u.name)}</b><small>${LEVEL[u.role].t}</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div></header>`;
}
function roleNote(u){
  if(u.role==='viewer')return `<b>سطح نمایشی:</b> فقط مشاهده. شماره تماس و کد ملی افراد برای این سطح پنهان است.`;
  if(u.role==='operator')return `<b>کارشناس محله ${esc(u.city)}:</b> محله‌هایی که به شما تخصیص داده شده را ثبت و ویرایش می‌کنید. هر ثبت شما پس از تأیید رابط استانی نهایی می‌شود.`;
  if(u.role==='supervisor')return `<b>رابط استانی ${esc(u.province||'')}:</b> ثبت‌های شما بدون نیاز به تأیید اعمال می‌شود؛ مدیر سامانه می‌تواند آن‌ها را لغو کند.`;
  return '';
}
function roleBanner(u,route){
  if(route!=='list'&&route!=='people')return '';
  if(bannerOff(u.role)||!roleNote(u))return '';
  /* shown once; afterwards the same note stays in the account menu */
  try{localStorage.setItem(KEY+'-banner-'+u.role,'1');}catch(x){}
  return `<div class="banner d-only"><span class="banner-t">${roleNote(u)}</span><button class="banner-x" data-act="dismiss-banner" aria-label="بستن این راهنما">×</button></div>`;
}

function finishLogin(u,how,remember){

  try{sessionStorage.setItem(KEY+'-u',session);if(remember)localStorage.setItem(KEY+'-remember',JSON.stringify({u:u.id,exp:Date.now()+REMEMBER_MS}));}catch(x){}

function sendOtp(a){const u=db.users.find(x=>x.active&&x.nid===a.nid);a.uid=u?.id||null;a.code=String(10000+crypto.getRandomValues(new Uint32Array(1))[0]%90000);a.exp=Date.now()+OTP_TTL;a.sent=Date.now();a.tries=a.tries||0;}
function badTry(a,fail,msg){a.tries=(a.tries||0)+1;
  if(a.tries>=OTP_TRIES){try{localStorage.setItem(lockKey(a.nid),String(Date.now()+LOCK_MS));}catch(x){}ui.auth={step:'nid',nid:a.nid,err:'تلاش‌های ناموفق زیاد شد؛ ورود با این کد ملی ۱۵ دقیقه بسته شد.'};render();return;}
  fail((msg||'کد واردشده درست نیست.')+` ${fa(OTP_TRIES-a.tries)} تلاش دیگر باقی است.`);}

const hayN=new WeakMap();
function nbHay(n){let h=hayN.get(n);if(h&&h.v===ver)return h.s;const s=qnorm([n.name,n.city,n.code,n.address,n.postal,...n.links.map(l=>getP(l.pid)?.name||'')].join(' '));hayN.set(n,{v:ver,s});return s;}
function filtered(){
  const f=ui.f,q=qnorm(f.q),u=me();
  const opId=f.op==='me'?u.id:f.op;
  let list=db.nb.filter(n=>{
    if(!visN(n))return false;
    if(f.city&&n.city!==f.city)return false;
    if(f.district&&String(n.district)!==String(f.district))return false;
    if(f.flag&&n.flag!==f.flag)return false;
    if(f.active==='yes'&&!n.active)return false;
    if(f.active==='no'&&n.active)return false;
    if(opId==='none'?n.op:opId&&n.op!==opId)return false;
    if(f.pend==='yes'&&!hasPending(n))return false;
    if(f.need&&nbNeed(n).k!==f.need)return false;
    if(f.cat&&!openProblems(n).some(p=>p.cat===f.cat))return false;
    if(f.prio&&!openProblems(n).some(p=>p.prio===f.prio))return false;
    if(f.role&&!n.links.some(l=>!l._st&&l.roles.includes(f.role)))return false;
    if(q&&!nbHay(n).includes(q))return false;
    return true;
  });
  const s=f.sort;
  const lr=new Map(list.map(n=>[n.id,lastReview(n)]));
  list.sort((a,b)=>s==='code'?(a.code||'').localeCompare(b.code||''):s==='open'?openProblems(b).length-openProblems(a).length:s==='review'?lr.get(b.id).localeCompare(lr.get(a.id)):s==='stale'?lr.get(a.id).localeCompare(lr.get(b.id)):a.name.localeCompare(b.name,'fa'));
  return list;
}

function pFiltered(){

    if(f.skill&&!(p.skills||[]).includes(f.skill))return false;

function todayTasks(u,nbs){

function diffHtml(c){
  const o=target(c);
  if(c.op==='delete')return `<p class="small">حذف ${ENT[c.ent]} ${o?`«${esc(o.title||o.name||o.summary||'')}»`:''}</p>`;
  const data=c.op==='create'?(o?strip(o):c.data):c.data;if(!data)return '';
  const keys=Object.keys(data).filter(k=>!DIFF_SKIP.has(k)&&!(c.op==='create'&&(data[k]===''||data[k]==null||(Array.isArray(data[k])&&!data[k].length))));
  if(!keys.length)return '';
  const row=k=>`<tr><th>${FL[k]||k}</th>${c.op==='update'?`<td class="old">${esc(fmtVal(k,o?.[k]))}</td><td class="arrow">←</td>`:''}<td class="new">${esc(fmtVal(k,data[k]))}</td></tr>`;
  /* phone: the first rows tell the story; the rest open on demand */
  const PRI=['title','name','summary','result','prio','status','mobile','roles','type','date'];
  if(isMob()&&keys.length>3){const ks=[...keys].sort((a,b)=>(PRI.indexOf(a)+1||99)-(PRI.indexOf(b)+1||99));return `<table class="diff"><tbody>${ks.slice(0,2).map(row).join('')}</tbody></table><details class="diff-more"><summary>${fa(keys.length-2)} مورد دیگر</summary><table class="diff"><tbody>${ks.slice(2).map(row).join('')}</tbody></table></details>`;}
  return `<table class="diff"><tbody>${keys.map(row).join('')}</tbody></table>`;
}
function fmtVal(k,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '—';
  if(k==='steps')return fa(v.length)+' مرحله';
  if(k==='pids')return v.map(id=>getP(id)?.name||'—').join('، ');
  if(Array.isArray(v))return v.join('، ');
  if(k==='prio')return PRIO[v]?.t||v;
  if(k==='status')return (PSTAT[v]||ISTAT[v])?.t||v;
  if(k==='active')return v?'فعال':'غیرفعال';
  if(k==='gender')return GENDER[v]||v;
  if(k==='marital')return MARITAL[v]||v;
  if(k==='coop')return COOP[v]?.t||v;
  if(k==='flag')return FLAG[v]?.t||v;
  if(k==='pflag')return PFLAG[v]?.t||v;
  if(k==='date'||k==='flagSince')return fmtDate(v);
  if(k==='pid')return getP(v)?.name||'—';
  if(k==='op')return uName(v);
  if(k==='related'){for(const n of db.nb){const p=n.problems.find(x=>x.id===v);if(p)return p.title;}return '—';}
  if(k==='nid')return seeNid()?fa(v):'••••••••••';
  if(k==='mobile')return showPhone(v);
  if(typeof v==='number')return k==='lat'||k==='lng'?fa(v):num(v);
  return fa(v);
}

function qWarn(g){

  g.forEach(x=>{const pid=x.ent==='person'?x.tid:x.ent==='link'?x.data?.pid:null;if(!pid||seen.has(pid))return;seen.add(pid);const p=getP(pid);if(!p)return;

    dup.forEach(o=>{const ns=linksOf(o.id).map(y=>y.n.name);out.push(`<div class="qwarn bad">${p.mobile&&o.mobile===p.mobile?'همین شماره موبایل':'همین کد ملی'} برای «${esc(o.name)}» هم ثبت شده است${ns.length?' (متولی '+ns.map(esc).join('، ')+')':''}. احتمال ثبت تکراری را بررسی کنید.</div>`);});
    const other=linksOf(p.id).filter(y=>!y.l._st&&y.n.id!==x.nb).map(y=>y.n.name);
    if(other.length)out.push(`<div class="qwarn">«${esc(p.name)}» متولی ${other.map(esc).join('، ')} هم هست.</div>`);});
  return out.join('');
}

    <span class="coords small" id="f_coords">${has?'مختصات: <span class="num" dir="ltr">'+fa(v.lat.toFixed(5))+', '+fa(v.lng.toFixed(5))+'</span>':'روی نقشه بزنید تا مرکز محله نشانه‌گذاری شود.'}</span>

function wireDate(wrap){
  const inp=$('input[type=hidden]',wrap),btn=$('.date-btn',wrap),cal=$('.dp',wrap);
  const max=wrap.dataset.max==='today'?today():'';
  let view,mode='days';
  const close=()=>{cal.hidden=true;btn.setAttribute('aria-expanded','false');};
  const set=iso=>{inp.value=iso;$('.dv',btn).textContent=iso?jLabel(iso):'انتخاب تاریخ';$('.dr',btn).textContent=iso?relDay(iso):'';wrap.classList.remove('err');$('.errmsg',wrap)?.remove();close();btn.focus();};
  const draw=()=>{
    const td=today(),sel=inp.value;
    if(mode==='days'){
      const first=jToIso(view.jy,view.jm,1),off=(new Date(first+'T12:00:00').getDay()+1)%7,n=jLen(view.jy,view.jm);

function wireMap(f,fl){

  const citySel=$('#f_city',f);const cityName=()=>citySel?citySel.value:fl.city;
  let mk=null;const ctx=L.layerGroup().addTo(m);
  const drawCtx=()=>{ctx.clearLayers();const c=cityName();db.nb.forEach(n=>{if(n.city!==c||n.lat==null||n===fl.self||n._st||!nbIn(n))return;

    if(!mk){mk=L.marker([lat,lng],{icon:pinIcon(),draggable:true,keyboard:false}).addTo(m);mk.on('dragend',()=>{const q=mk.getLatLng();place(q.lat,q.lng);});}else mk.setLatLng([lat,lng]);

    clr.hidden=false;wrap.classList.remove('err');$('.errmsg',wrap)?.remove();};
  const centerCity=()=>{const c=cityOf(cityName());m.setView(c?[c.lat,c.lng]:[32.6,53.5],c?12:5);};

      ()=>{geo.disabled=false;geo.lastChild.textContent=t;toast('دسترسی به موقعیت داده نشد؛ نقطه را روی نقشه بزنید.');},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});});

}

/* ================= CSV export (opens in Excel; UTF-8 with BOM) ================= */
function downloadCSV(name,rows){
  if(!document.querySelector('link[rel="manifest"]')){toast('دریافت فایل در این پیش‌نمایش ممکن نیست؛ در نسخه نصبی (index.html) کار می‌کند');return;}
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);toast('فایل آماده شد');}catch(e){toast('دانلود در این پیش‌نمایش ممکن نیست');}
}

    case 'pcourse-del':{const u=me(),v=b.dataset.v,st=db.settings;if(!isSup()||!st.provCourses?.[u.province])break;if(!b.dataset.armed){b.dataset.armed='1';b.textContent='دوباره بزنید';break;}st.provCourses[u.province]=st.provCourses[u.province].filter(x=>x!==v);db.changes.unshift({id:uid(),t:Date.now(),uid:u.id,ent:'user',op:'delete',st:'auto',txt:'حذف دوره‌ی استانی «'+v+'»',tn:'استان '+u.province});persist();render();toast('دوره از فهرست حذف شد؛ سوابق ثبت‌شده می‌ماند');break;}

app.addEventListener('submit',e=>{
  if(e.target.id!=='loginform')return;
  e.preventDefault();
  const a=ui.auth||(ui.auth={step:'nid'}),now=Date.now();
  const fail=m=>{a.err=m;render();setTimeout(()=>$('#loginform input:not([type=checkbox])')?.focus(),0);};
  const lockMsg=lk=>`به‌دلیل تلاش‌های ناموفق، ورود با این کد ملی تا ${fa(Math.ceil((lk-now)/60000))} دقیقه‌ی دیگر بسته است.`;
  if(a.step==='nid'){
    const nid=normDigits($('#lg-nid').value).replace(/\D/g,'');a.nid=nid;
    if(!nidOk(nid))return fail('یک کد ملی ۱۰ رقمی معتبر وارد کنید.');
    const lk=lockedUntil(nid);if(lk>now)return fail(lockMsg(lk));
    a.tries=0;sendOtp(a);a.step='code';a.err='';render();setTimeout(()=>$('#lg-code')?.focus(),0);return;
  }
  if(a.step==='code'){
    const c=normDigits($('#lg-code').value).replace(/\D/g,'');a.rem=$('#lg-rem').checked;
    const lk=lockedUntil(a.nid);if(lk>now)return fail(lockMsg(lk));
    if(!c)return fail('کد پیامک‌شده را وارد کنید.');
    if(a.uid&&c===a.code&&now>a.exp)return fail('این کد منقضی شده است؛ «ارسال دوباره» را بزنید.');
    if(!a.uid||c!==a.code)return badTry(a,fail);
    const u=getU(a.uid);if(!u||!u.active)return fail('ورود با این حساب ممکن نیست.');
    if(u.role==='admin'){a.step='pw';a.err='';a.code=null;render();setTimeout(()=>$('#lg-pw')?.focus(),0);return;}
    return finishLogin(u,'sms',a.rem);
  }
  if(a.step==='pw'){
    const u=getU(a.uid);const lk=lockedUntil(a.nid);if(lk>now)return fail(lockMsg(lk));
    if(!u||!u.active||pwHash($('#lg-pw').value)!==u.pwh)return badTry(a,fail,'رمز عبور درست نیست.');
    return finishLogin(u,'sms+pw',a.rem);
  }
});

app.addEventListener('change',e=>{
  const t=e.target;const k=t.dataset.filter;
  if(k&&k!=='q'){ui.f[k]=t.value;ui.page=1;saveFilters();updateList();}
  if(t.dataset.pfilter&&t.dataset.pfilter!=='q'){ui.pf[t.dataset.pfilter]=t.value;if(t.dataset.pfilter==='city')ui.pf.district='';ui.pPage=1;if(t.dataset.pfilter==='city')render();else updatePeople();}
  if(t.dataset.prorg!==undefined){ui.prf.org=t.value;ui.prf.page=1;render();}
  if(t.dataset.qf){ui.qf[t.dataset.qf]=t.value;render();}
  if(t.dataset.lf){ui.lf[t.dataset.lf]=t.value;ui.logPage=1;render();}
  if(t.dataset.uf&&t.dataset.uf!=='q'){ui.uf[t.dataset.uf]=t.value;ui.usersPage=1;render();}
  if(t.dataset.actChange==='perfcity'){ui.perfCity=t.value;render();}

  if(t.dataset.change==='persona')switchPersona(t.value);
});
